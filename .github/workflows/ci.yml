name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only token, no secrets: the tests mock every provider and send no prompt
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.317
      - name: Type-check against the vendored declarations
        run: |
          # the vendored file must come from the Claude Code version installed above
          head -1 vendor/claude-code/index.d.ts | grep -qx '// Written by Claude Code 2.1.317.' || { echo 'vendor/claude-code/index.d.ts is not from Claude Code 2.1.317; replace it (vendor/README.md)'; exit 1; }
          npx -y -p typescript@5.6.3 tsc -p tsconfig.ci.json
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Run the tests
        run: claude plugin test .

  # the git guard against each system's real git: no CLI sign-in, no secrets
  real-git:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git guard with real git
        run: npx -y tsx@4.19.2 ci/real-gitguard.ts
      - name: Workspace copy with real git
        run: npx -y tsx@4.19.2 ci/real-workspace.ts

  # the MCP server the Codex and Antigravity plugins start: built from the same modules, checked over stdio
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the MCP server
        run: npx -y esbuild@0.24.0 hosts/mcp/server.ts --bundle --platform=node --target=node20 --format=esm --alias:claude-code=./hosts/mcp/claude-code-shim.ts --outfile=dist/jervis-mcp.mjs --legal-comments=none --log-level=warning
      - name: The committed bundle is the one the source builds
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- dist/jervis-mcp.mjs
      - name: MCP acceptance (no provider is called)
        run: npx -y tsx@4.19.2 ci/mcp-smoke.ts
      - name: The Antigravity plugin ships the same bundle
        if: matrix.os == 'ubuntu-latest'
        run: cmp dist/jervis-mcp.mjs integrations/antigravity/dist/jervis-mcp.mjs
