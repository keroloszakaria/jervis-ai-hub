name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only token, no secrets: the tests mock every provider and send no prompt
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.317
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Run the tests
        run: claude plugin test .
